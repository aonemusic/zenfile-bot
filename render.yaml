# Render Blueprint: Docker background worker using Telegram polling.
# Set BOT_TOKEN as a secret in the Render dashboard after creating the service.
services:
  - type: worker
    name: zenfile-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_INPUT_MB
        value: "18"
      - key: MAX_OUTPUT_MB
        value: "49"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: JOB_TIMEOUT_SECONDS
        value: "300"
      - key: MAX_PDF_PAGES
        value: "100"
      - key: MAX_IMAGE_PIXELS
        value: "40000000"
      - key: MAX_ARCHIVE_FILES
        value: "500"
      - key: MAX_ARCHIVE_UNPACKED_MB
        value: "250"
      - key: TEMP_DIR
        value: /tmp/zenfile
      - key: LOG_LEVEL
        value: INFO
      - key: BOT_MODE
        value: polling
